name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest fastapi httpx
      - run: python -m pytest -q
  demo-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m meetingmind analyze samples/weekly_sync.txt > py.json
      - run: node scripts/demo_parity.js py.json
  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meetingmind .
      - run: docker run -d --name mm -p 8000:8000 meetingmind
      - name: Smoke test the API in the container
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/meetings -H 'content-type: application/json' \
            -d "$(python3 -c 'import json; print(json.dumps({"title":"Weekly sync","held_on":"2026-10-26","team":"data","transcript":open("samples/weekly_sync.txt").read()}))')" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["action_items"]) == 5, d; print("items:", len(d["action_items"]))'
          curl -sf -X PATCH localhost:8000/items/1 -H 'content-type: application/json' -d '{"status":"done"}'
          curl -sf localhost:8000/kpis/completion_rate_by_team | grep -q '"done_pct":20.0'
      - if: always()
        run: docker logs mm
