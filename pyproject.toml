[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetingmind"
version = "0.2.0"
description = "Meeting transcripts to action items with owners and due dates, plus team analytics and SQL KPIs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hrutishaa Nanduti" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
meetingmind = "meetingmind.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["meetingmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
